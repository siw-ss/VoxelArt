<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern Lake — Voxel Scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="title-card">
        <h1>Lantern<br />Lake</h1>
        <p class="subtitle">A Twilight Dream</p>
      </div>
    </div>

    <div id="desc-card">
      <span class="desc-label">About this scene</span>
      <span class="desc-text" id="typewriter"></span
      ><span class="cursor" id="tw-cursor"></span>
    </div>

    <div id="dock" role="toolbar" aria-label="Scene controls">
      <label class="dock-item toggle" title="Auto-orbit">
        <input type="checkbox" id="rotate" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <path d="M21 3v5h-5" /></svg
        ></span>
        <span class="tip">Auto-orbit</span>
      </label>

      <label class="dock-item toggle" title="Fireflies">
        <input type="checkbox" id="fireflies-toggle" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3l1.5 3.5L17 8l-3.5 1.5L12 13l-1.5-3.5L7 8l3.5-1.5z" />
            <path d="M5 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" opacity="0.6" />
            <path
              d="M18 14l.75 1.5 1.5.75-1.5.75L18 18.5l-.75-1.5-1.5-.75 1.5-.75z"
              opacity="0.5"
            /></svg
        ></span>
        <span class="tip">Fireflies</span>
      </label>

      <label class="dock-item toggle" title="Boat release">
        <input type="checkbox" id="boat-toggle" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 20a8 8 0 0 0 16 0" />
            <path d="M4 18h12" />
            <path d="M10 18V8l4 3V8" />
            <path d="M10 8L6 11" opacity="0.6" /></svg
        ></span>
        <span class="tip">Boat release</span>
      </label>

      <div class="dock-sep"></div>

      <div
        class="dock-item lantern-item"
        id="lantern-btn"
        title="Lantern settings"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 2h6l1 4H8z" />
            <rect x="8" y="6" width="8" height="10" rx="1" />
            <path d="M12 16v3" />
            <path d="M10 19h4" />
            <path d="M12 9v4" opacity="0.5" /></svg
        ></span>
        <span class="tip">Lanterns</span>
      </div>

      <label class="dock-item toggle" title="Shadows">
        <input type="checkbox" id="shadows" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="9" r="5.5" />
            <path d="M14 18.5a5.5 5.5 0 1 0 0-9" opacity="0.5" /></svg
        ></span>
        <span class="tip">Shadows</span>
      </label>

      <div class="dock-sep"></div>

      <div
        class="dock-item sun-item"
        id="sun-btn"
        title="Time of day"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4.2" />
            <path
              d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"
            /></svg
        ></span>
        <span class="tip">Time of day</span>
      </div>

      <div class="dock-sep"></div>

      <label class="dock-item toggle" title="Home">
        <input type="checkbox" id="home-view" />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" /></svg
        ></span>
        <span class="tip">Home</span>
      </label>
    </div>

    <!-- Lantern panel -->
    <div class="lantern-flyout" id="lantern-panel">
      <div class="sun-head">
        <span>Lantern Settings</span><b id="lantern-label">Controls</b>
      </div>
      <label class="flyout-row">
        <span>Count</span>
        <input
          type="range"
          id="lantern-count"
          min="20"
          max="150"
          value="80"
          step="5"
        />
        <b id="lantern-count-val">80</b>
      </label>
      <label class="flyout-row">
        <span>Speed</span>
        <input
          type="range"
          id="lantern-speed"
          min="20"
          max="200"
          value="100"
          step="5"
        />
        <b id="lantern-speed-val">1.0x</b>
      </label>
      <label class="flyout-row">
        <span>Release</span>
        <input
          type="range"
          id="lantern-interval"
          min="4"
          max="20"
          value="10"
          step="1"
        />
        <b id="lantern-interval-val">10s</b>
      </label>
    </div>

    <!-- Sun/Time panel -->
    <div class="sun-flyout" id="sun-panel">
      <svg
        class="sun-arc"
        viewBox="0 0 200 60"
        fill="none"
        style="width: 100%; height: 42px; margin-bottom: 8px"
      >
        <path
          d="M10 55 Q100 -15 190 55"
          stroke="rgba(255,255,255,0.12)"
          stroke-width="2"
          fill="none"
          stroke-dasharray="4 4"
        />
        <circle id="sun-dot" cx="50" cy="38" r="7" fill="url(#sun-grad)" />
        <defs>
          <radialGradient id="sun-grad">
            <stop offset="0%" stop-color="#fff" />
            <stop offset="100%" stop-color="#ffaa22" />
          </radialGradient>
        </defs>
      </svg>
      <div class="sun-head">
        <span>Time of day</span><b id="sun-val">Golden Hour</b>
      </div>
      <input type="range" id="sun" min="0" max="100" value="30" />
      <div
        style="
          text-align: center;
          margin-top: 8px;
          font-size: 10px;
          color: rgba(255, 255, 255, 0.4);
          letter-spacing: 0.5px;
        "
      >
        Drag to change time of day
      </div>
    </div>

    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    <div id="loader"><div id="loader-msg">Lighting the lanterns…</div></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
