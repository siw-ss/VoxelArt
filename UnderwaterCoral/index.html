<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underwater Coral Kingdom — Voxel Scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐠</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="title-card">
        <h1>Underwater<br />Coral Kingdom</h1>
        <p class="subtitle">Into the Deep</p>
      </div>
    </div>

    <div id="desc-card">
      <span class="desc-label">About this scene</span>
      <span class="desc-text" id="typewriter"></span
      ><span class="cursor" id="tw-cursor"></span>
    </div>

    <div id="dock" role="toolbar" aria-label="Scene controls">
      <label class="dock-item toggle" title="Fish schools">
        <input type="checkbox" id="fish-toggle" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6.5 12c3-5 9-5 12 0-3 5-9 5-12 0z" />
            <circle cx="16" cy="12" r="1" fill="currentColor" />
            <path d="M2 12l3-2v4z" /></svg
        ></span>
        <span class="tip">Fish</span>
      </label>

      <div
        class="dock-item bubble-item"
        id="bubble-btn"
        title="Bubble settings"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="8" r="3" />
            <circle cx="16" cy="13" r="2.5" />
            <circle cx="7" cy="17" r="1.8" />
            <circle cx="14" cy="5" r="1.2" /></svg
        ></span>
        <span class="tip">Bubbles</span>
      </div>

      <div
        class="dock-item depth-item"
        id="depth-btn"
        title="Depth control"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18M3 12h18M3 18h18" />
            <path d="M12 2v20" opacity="0.4" />
            <path d="M8 20l4 2 4-2" /></svg
        ></span>
        <span class="tip">Depth</span>
      </div>

      <div class="dock-sep"></div>

      <label class="dock-item toggle" title="Auto-orbit">
        <input type="checkbox" id="rotate" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <path d="M21 3v5h-5" /></svg
        ></span>
        <span class="tip">Auto-orbit</span>
      </label>

      <label class="dock-item toggle" title="Shadows">
        <input type="checkbox" id="shadows" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="9" r="5.5" />
            <path d="M14 18.5a5.5 5.5 0 1 0 0-9" opacity="0.5" /></svg
        ></span>
        <span class="tip">Shadows</span>
      </label>

      <label class="dock-item toggle" title="Bio-glow">
        <input type="checkbox" id="bioglow-toggle" checked />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3l1.5 3.5L17 8l-3.5 1.5L12 13l-1.5-3.5L7 8l3.5-1.5z" />
            <path d="M5 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" opacity="0.6" />
            <path
              d="M18 14l.75 1.5 1.5.75-1.5.75L18 18.5l-.75-1.5-1.5-.75 1.5-.75z"
              opacity="0.5"
            /></svg
        ></span>
        <span class="tip">Bio-glow</span>
      </label>

      <div class="dock-sep"></div>

      <label class="dock-item toggle" title="Home">
        <input type="checkbox" id="home-view" />
        <span class="ico" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" /></svg
        ></span>
        <span class="tip">Home</span>
      </label>
    </div>

    <!-- Bubble panel -->
    <div class="bubble-flyout" id="bubble-panel">
      <div class="sun-head">
        <span>Bubble Settings</span><b id="bubble-label">Controls</b>
      </div>
      <label class="flyout-row">
        <span>Density</span>
        <input
          type="range"
          id="bubble-count"
          min="20"
          max="200"
          value="100"
          step="10"
        />
        <b id="bubble-count-val">100</b>
      </label>
      <label class="flyout-row">
        <span>Speed</span>
        <input
          type="range"
          id="bubble-speed"
          min="50"
          max="200"
          value="100"
          step="10"
        />
        <b id="bubble-speed-val">1.0x</b>
      </label>
    </div>

    <!-- Depth panel -->
    <div class="depth-flyout" id="depth-panel">
      <div class="sun-head">
        <span>Ocean Depth</span><b id="depth-val">Shallow</b>
      </div>
      <input type="range" id="depth-slider" min="0" max="100" value="30" />
      <div
        style="
          text-align: center;
          margin-top: 8px;
          font-size: 10px;
          color: rgba(255, 255, 255, 0.4);
          letter-spacing: 0.5px;
        "
      >
        Drag to descend deeper
      </div>
    </div>

    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    <div id="loader"><div id="loader-msg">Descending into the deep…</div></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
