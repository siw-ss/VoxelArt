<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nordic Ice Palace — Voxel Scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="title-card">
        <h1>Nordic Ice<br />Palace</h1>
        <p class="subtitle">Aurora &amp; Eternal Frost</p>
      </div>
    </div>

    <div id="desc-card">
      <span class="desc-label">About this scene</span>
      <span class="desc-text" id="typewriter"></span
      ><span class="cursor" id="tw-cursor"></span>
    </div>

    <div id="dock" role="toolbar" aria-label="Scene controls">
      <label class="dock-item toggle" title="Auto-orbit">
        <input type="checkbox" id="rotate" checked />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <path d="M21 3v5h-5" />
          </svg>
        </span>
        <span class="tip">Auto-orbit</span>
      </label>

      <label class="dock-item toggle" title="Snowfall">
        <input type="checkbox" id="snow-toggle" checked />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2v20" />
            <path d="M18 6l-6 6-6-6" />
            <path d="M18 18l-6-6-6 6" />
            <path d="M2 12h20" />
            <path d="M6 2l6 6 6-6" opacity="0.5" />
            <path d="M6 22l6-6 6 6" opacity="0.5" />
          </svg>
        </span>
        <span class="tip">Snowfall</span>
      </label>

      <label class="dock-item toggle" title="Shadows">
        <input type="checkbox" id="shadows" checked />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="9" r="5.5" />
            <path d="M14 18.5a5.5 5.5 0 1 0 0-9" opacity="0.5" />
          </svg>
        </span>
        <span class="tip">Shadows</span>
      </label>

      <label class="dock-item toggle" title="Deep frost">
        <input type="checkbox" id="season" />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </span>
        <span class="tip">Deep frost</span>
      </label>

      <label class="dock-item toggle" title="Dragons">
        <input type="checkbox" id="dragons-toggle" checked />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10.706 8.849l-5.706 -3.301l-2 6.452l3.5 -1.973l.5 2.973l3.555 -1.385"
            />
            <path
              d="M15 9c0 3.5 4 3 4 7c0 3 -3 5 -5.5 5s-6 -.5 -6.5 -5c2 2 6.592 3.043 7.5 1c1.094 -2.461 -4 -3.459 -4 -6.5c0 -2.062 .5 -2.5 1.8 -3.2"
            />
            <path d="M18 6a3 3 270 1 0 -3 3h5l1 -3h-3" />
            <path d="M15 3h-8l5 3" />
          </svg>
        </span>
        <span class="tip">Dragons</span>
      </label>

      <div class="dock-sep"></div>

      <div
        class="dock-item aurora-item"
        id="aurora-btn"
        title="Aurora controls"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 7c3 -2 6 -2 9 0s6 2 9 0" />
            <path d="M3 12c3 -2 6 -2 9 0s6 2 9 0" />
            <path d="M3 17c3 -2 6 -2 9 0s6 2 9 0" />
          </svg>
        </span>
        <span class="tip">Aurora</span>
      </div>

      <div
        class="dock-item snow-item"
        id="snow-btn"
        title="Snow density"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="6" cy="5" r="1.5" fill="currentColor" opacity="0.4" />
            <circle cx="14" cy="4" r="1" fill="currentColor" opacity="0.3" />
            <circle cx="18" cy="8" r="1.5" fill="currentColor" opacity="0.5" />
            <circle cx="10" cy="9" r="1" fill="currentColor" opacity="0.4" />
            <circle cx="4" cy="13" r="1.5" fill="currentColor" opacity="0.6" />
            <circle cx="12" cy="14" r="1.5" fill="currentColor" opacity="0.5" />
            <circle cx="19" cy="14" r="1" fill="currentColor" opacity="0.4" />
            <circle cx="7" cy="19" r="1" fill="currentColor" opacity="0.3" />
            <circle cx="15" cy="19" r="1.5" fill="currentColor" opacity="0.5" />
          </svg>
        </span>
        <span class="tip">Snow density</span>
      </div>

      <div
        class="dock-item time-item"
        id="time-btn"
        title="Time of day"
        tabindex="0"
      >
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 6v6l4 2" />
          </svg>
        </span>
        <span class="tip">Time of day</span>
      </div>

      <div class="dock-sep"></div>

      <label class="dock-item toggle" title="Home">
        <input type="checkbox" id="home-view" />
        <span class="ico" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </span>
        <span class="tip">Home</span>
      </label>
    </div>

    <!-- Aurora panel -->
    <div class="aurora-flyout" id="aurora-panel">
      <div class="sun-head">
        <span>Aurora Borealis</span><b id="aurora-label">Controls</b>
      </div>
      <label class="flyout-row">
        <span>Speed</span>
        <input
          type="range"
          id="aurora-speed"
          min="20"
          max="300"
          value="100"
          step="1"
        />
        <b id="aurora-speed-val">1.0x</b>
      </label>
      <label class="flyout-row">
        <span>Intensity</span>
        <input
          type="range"
          id="aurora-intensity"
          min="20"
          max="100"
          value="100"
          step="1"
        />
        <b id="aurora-intensity-val">100%</b>
      </label>
      <label class="flyout-row toggle-row">
        <input type="checkbox" id="aurora-cycle" />
        <span>Color Cycle</span>
      </label>
    </div>

    <!-- Snow panel -->
    <div class="snow-flyout" id="snow-panel">
      <div class="sun-head">
        <span>Snow density</span><b id="snow-val">300</b>
      </div>
      <input
        type="range"
        id="snow-density"
        min="0"
        max="800"
        value="300"
        step="10"
      />
      <div
        style="
          text-align: center;
          margin-top: 8px;
          font-size: 10px;
          color: rgba(255, 255, 255, 0.4);
          letter-spacing: 0.5px;
        "
      >
        Adjust snowfall particle count
      </div>
    </div>

    <!-- Time-of-day panel -->
    <div class="time-flyout" id="time-panel">
      <div class="sun-head">
        <span>Night sky preset</span><b id="time-label">Green Night</b>
      </div>
      <div class="tod-presets">
        <button class="tod-btn active" data-preset="greenNight">
          Green Night
        </button>
        <button class="tod-btn" data-preset="midnightBlue">
          Midnight Blue
        </button>
        <button class="tod-btn" data-preset="purpleDusk">Purple Dusk</button>
      </div>
    </div>

    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    <div id="loader"><div id="loader-msg">Building ice palace…</div></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
